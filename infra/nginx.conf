server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;          # server-sent events for live rescues
    proxy_read_timeout 3600s;
    client_max_body_size 12m;
  }
  location /health/ { proxy_pass http://api:8000; }
  # Hashed build files never change, so cache them forever. A missing one must be a real 404:
  # answering with index.html makes a stale lazy-loaded page fail to parse and blanks the app.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # The app shell and service worker must always be revalidated, or browsers keep an old build.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /registerSW.js { add_header Cache-Control "no-cache"; }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
